<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Agrinho 2026</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <nav>
      <h1>Agrinho<span>2026</span></h1>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <section class="pagina-contato">
    <div class="caixa-contato">
      <h2>Entre em Contato 🌱</h2>
      <p>Envie sua mensagem sobre o projeto Agrinho 2026.</p>
      <form id="formContato">
        <input type="text" id="nome" placeholder="Seu Nome" required>
        <input type="email" id="email" placeholder="Seu Email" required>
        <textarea id="mensagem" placeholder="Digite sua mensagem..." required></textarea>
        <button type="submit">Enviar Mensagem</button>
      </form>
      <div id="resposta"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
